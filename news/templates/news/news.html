{% extends "pgaweb/page.html" %}
{% load static %}

{% block title %}News Archive{% endblock %}

{% block content %}
<div class="pga-page-head">
    <span class="pga-eyebrow">news</span>
    <h1>News Archive</h1>
    <p class="pga-feed-link"><a href="{% url 'news_feed' %}"><i title="RSS feed" class="fas fa-rss-square text-warning" aria-hidden="true"></i></a> Subscribe by RSS</p>
</div>

<div class="pga-prose">
{% for article in news.all %}
    <h2><a id="{{ article.id }}">{{ article.display_date }} - {{ article.title }}<a/></h2>
    <p>{{ article.content|safe }}</p>
    {% endfor %}
</div>
{% endblock %}
